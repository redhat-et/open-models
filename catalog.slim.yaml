    docs_url: https://gitlab.cee.redhat.com/models-corp/user-documentation/-/blob/main/how-to-guides/integration/use-claude-code-with-models-corp.md
    notes: Served by models-corp (IT), not OCTO infra - same weights as frontier
      but 262k context (2x). Bring your own models-corp token (link below);
