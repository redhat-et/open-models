# Single source of truth for the OCTO Open Models platform.
# Every deploy file, user config, and the web front end read from here.
# Regenerate user configs after editing: scripts/gen_configs.py

platform:
  name: OCTO Open Models
  dashboard_base: https://grafana-octo-models.apps.emerg.pcbk.p1.openshiftapps.com/d/open-models/octo-open-models-usage-and-activity
  app_url: https://octo-app-octo-models.apps.emerg.pcbk.p1.openshiftapps.com

defaults:
  health_path: /health
  models_path: /v1/models
  chat_path: /v1/chat/completions

# Central LiteLLM gateway (v2 platform). All user traffic goes through here;
# users never hit vLLM base_urls directly once the gateway is live.
# Regenerate gateway config after editing: scripts/gen_litellm_config.py
gateway:
  # route assigned after deploy, e.g. https://litellm-octo-models.apps.emerg.../v1
  base_url: https://litellm-octo-models.apps.emerg.pcbk.p1.openshiftapps.com/v1
  # licensing workaround: one shared litellm user owns every virtual key;
  # our app backend maps key -> github user in its own Postgres.
  shared_litellm_user: octo-shared
  # defaults applied when the backend mints a virtual key
  key_defaults:
    rpm: 600
    tpm: 250000
    max_parallel_requests: 8
    max_budget: 100       # notional USD/day - abuse guard only, never
    budget_duration: 1d   # surfaced in the UI; we show SAVINGS, not bills
  # notional $/Mtok are priced off frontier APIs; users see "saved vs frontier
  # API" = spend x this multiplier (Claude/GPT class, ~10x our notionals)
  frontier_savings_multiplier: 8
  # Tiers are NAMED BY ROLE, not speed (a frontier model may be slower than
  # core - that is fine; role = what you reach for it for):
  #   frontier = hardest agentic work (27B FP8 on a rented MI300X - 192GB
  #              gives long-context headroom the 32GB bulk card cannot)
  #   core     = daily driver coding (Flash-Next on the 4x L40S cluster) -
  #              default; 33 tok/s solo, 19 tok/s each at 10 concurrent
  #   bulk     = high-volume background/summarize (27B on the 5090, cheap;
  #              snappy solo but ~100 tok/s aggregate ceiling)
  #   lab      = sparks/strix: bake-offs + direct endpoints, no SLA, never a
  #              fallback target
  # litellm fallbacks on 5xx/timeout (acyclic; core box is the floor - it
  # never falls back, protecting it from pileups). Lab tier is deliberately
  # absent: slow, listed-only, not worth a tunnel into the serving path.
  fallbacks:
    qwen38-27b-fast: [qwen38-flash-next]
    qwen38-27b-frontier: [qwen38-flash-next]  # floor: core covers frontier gaps

hosts:
  hotaisle-1gpu:
    hardware: 1x AMD Instinct MI300X (192GB) - frontier tier, billed while the VM exists ($3/hr) - delete when idle
    notes: enc1-gpuvm015 (team rh-octo-emerging-tech, was enc1-gpuvm013); power-off
      does NOT stop billing - only delete does (hotaisle-api.sh). Matt's box
      enc1-gpuvm024 shares the team - NEVER touch it.
    wake_note: "Wake re-provisions from scratch and re-downloads ~28GB weights
      from HF - cold start ~15 min. Until it serves, frontier traffic falls
      back to core (flash-next)."
    compute:
      "off": HOTAISLE_TEAM=rh-octo-emerging-tech HOTAISLE_VM=enc1-gpuvm015 ./scripts/hotaisle-api.sh off
      "on": HOTAISLE_TEAM=rh-octo-emerging-tech HOTAISLE_VM=enc1-gpuvm015 HOTAISLE_IP=23.183.40.80 HOTAISLE_SSH_CONFIG=/tmp/om-ssh-home/.ssh/config HOTAISLE_MODEL=Qwen/Qwen3.8-27B-FP8 HOTAISLE_CTX=131072 HOTAISLE_TOOL_ARGS="--enable-auto-tool-choice --tool-call-parser qwen3_xml" HOTAISLE_REASON_ARGS="--reasoning-parser qwen3" ./scripts/hotaisle-api.sh up
  spark2:
    hardware: DGX Spark (GB10, 128GB unified)
    notes: Lab tier - direct endpoint only (VPN). Bake-off sandbox for new candidates.
  rtx5090:
    hardware: RTX 5090 (32GB GDDR7)
    compute:
      "off": ssh -i /tmp/om-ssh-home/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/om-ssh-home/.ssh/known_hosts -p 8022 bturner@136.47.153.236 'podman stop qwen38-nvfp4'
      "on": ssh -i /tmp/om-ssh-home/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/om-ssh-home/.ssh/known_hosts -p 8022 bturner@136.47.153.236 'podman start qwen38-nvfp4 && sleep 45'
    notes: Bulk tier - background/batch work; snappy solo but ~100 tok/s aggregate ceiling.
      Desk-side box; ssh moved to port 8022 (22 closed; 6999-9000 is the router-forwarded range). Wake via cluster
      works today - the range is already port-forwarded.
  openshift:
    hardware: OpenShift cluster, g6e GPU nodes
    notes: Core tier - daily driver on covered g6e (4x L40S, TP=4, MTP spec-decode), edge route.
      Plan is to retire the 4x L40S (~$6/hr) for a single RTX Pro 6000 ($3/hr, similar VRAM).
  spark1:
    hardware: DGX Spark (GB10, 128GB unified)
    notes: Future slot.
  spark3:
    hardware: DGX Spark (GB10, 128GB unified)
    notes: Lab bake-off box - serving RadixArk/Qwen3.8-Flash-Next-NVFP4, using https://github.com/blazux/qwen3.8-Flash-DGX.
  strix-halo:
    hardware: AMD Strix Halo (Ryzen AI Max, 128GB unified)
    notes: Grab it. Has qwen 3.8 on it already (verify). Future slot.

models:
  - id: ocp-flash-next
    host: openshift
    name: "Qwen 3.8 Flash Next NVFP4 (Core)"
    tier: core
    group: qwen38-flash-next
    price: {input: 0.20, output: 1.00}  # notional $/Mtok vs public APIs
    base_url: https://qwen38-flash-next-d57178e0-2037-479e-9a33-217f81dd6f5e.apps.emerg.pcbk.p1.openshiftapps.com/v1
    api_key: sk-local
    max_output: 8192
    quant: nvfp4
    seats: 10  # measured 2026-09-07: 18.8 tok/s each at 10 concurrent (173 tok/s aggregate); 14.3 at 16
    status: running

  - id: rtx5090-fast
    host: rtx5090
    name: "Qwen 3.8 27B NVFP4 (Bulk)"
    seats: 8  # measured 2026-09-07: 12.5 tok/s each to 8 concurrent (100 tok/s aggregate ceiling)
    tier: bulk
    group: qwen38-27b-fast
    price: {input: 0.30, output: 1.20}
    engine: {max_num_seqs: 32}
    base_url: http://136.47.153.236:8000/v1
    api_key: sk-local
    # deliberate cap, not the box's native max (75264) - keeps KV cache small
    # enough for max_num_seqs=32 on 32GB; hydrate_catalog.py never raises this
    # automatically. Also doubles as the fallback while the box is paused
    # (compute.off stops the container).
    context: 32768
    max_output: 8192
    quant: nvfp4
    status: running
    notes: Default daily driver; 32k context keeps KV small on 32GB.

  - id: spark2-smart
    host: spark2
    name: "Qwen 3.8 27B FP8 (Lab)"
    tier: lab
    group: qwen38-27b-smart
    price: {input: 0.30, output: 1.20}
    engine: {max_num_seqs: 16}
    base_url: http://octo-et-spark-2.khw.eng.rdu2.dc.redhat.com:8000/v1
    scrape_url: http://10.6.164.118:8000/v1  # IP: internal name won't resolve in containers
    api_key: sk-local
    max_output: 8192
    quant: fp8
    status: listed
    notes: Direct endpoint only (VPN) - slow, not metered through the gateway.

  - id: strix-halo
    host: strix-halo
    name: "Qwen3.8 27B (Strix Halo)"
    tier: lab
    group: qwen38-27b-fast  # joins the core pool once verified (redundancy)
    base_url: http://strix-halo:8080/v1
    # placeholder: box isn't confirmed reachable yet (internal hostname, needs
    # VPN) - update once grabbed, `make gen` will overwrite served_model then.
    served_model: Qwen/Qwen3.8-27B
    context: 131072
    quant: tbd
    status: planned
    notes: Verify what is actually serving on this box once we grab it.

  - id: hotaisle-frontier
    host: hotaisle-1gpu
    name: "Qwen 3.8 27B FP8 (Frontier)"
    # fallback for hydrate_catalog.py: the VM is deleted while paused, so
    # keep served_model/context for offline `make gen` runs.
    served_model: Qwen/Qwen3.8-27B-FP8
    tier: frontier
    group: qwen38-27b-frontier
    price: {input: 0.60, output: 2.40}  # notional $/Mtok vs public APIs
    engine: {max_num_seqs: 32}
    base_url: http://23.183.40.80:8000/v1
    scrape_url: http://23.183.40.80:8000/v1
    api_key: sk-local
    context: 131072
    quant: fp8
    status: running
    notes: Rented MI300X (Hot Aisle). Same weights as bulk but 192GB -> 131k
      context + 89% VRAM to KV. Falls back to core when the VM is dark.

  - id: spark3-qwen38-flash-next
    host: spark3
    name: "Qwen3.8-Flash-Next NVFP4 (Lab)"
    tier: lab
    group: qwen38-flash-next
    base_url: http://octo-et-spark-3.khw.eng.rdu2.dc.redhat.com:8000/v1
    scrape_url: http://10.6.164.125:8000/v1
    api_key: none
    max_output: 262144
    quant: nvfp4
    status: listed
    notes: 22.2 gen/s, 71.0 tot/s single stream, run with https://github.com/blazux/qwen3.8-Flash-DGX
