groups:
  - name: open-models
    rules:
      - alert: ModelEndpointDown
        expr: up{job="vllm"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "vLLM endpoint down for {{ $labels.model }}"

      - alert: ModelQueueBacklog
        expr: vllm:num_requests_waiting > 5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Request backlog on {{ $labels.model }} (>5 waiting for 10m)"

      - alert: SlowTimeToFirstToken
        expr: histogram_quantile(0.95, rate(vllm:time_to_first_token_seconds_bucket[5m])) > 5
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "p95 TTFT > 5s on {{ $labels.model }}"

      - alert: HostHighMemoryPressure
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.95
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.instance }} memory > 95% (unified memory boxes evict models)"
