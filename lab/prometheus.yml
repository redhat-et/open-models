global:
  scrape_interval: 5s

scrape_configs:
  - job_name: litellm
    metrics_path: /metrics/
    authorization:
      type: Bearer
      credentials: sk-lab-master
    static_configs:
      - targets: ["om-lab-litellm:4000"]
  - job_name: mock-vllm
    static_configs:
      - targets: ["mock-flash:8000", "mock-fast-a:8000", "mock-fast-b:8000"]
