apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    app: redis
    {{- include "octo-models.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels:
        app: redis
        {{- include "octo-models.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: {{ .Values.runAsUser }}
        fsGroup: {{ .Values.fsGroup }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
          ports: [{containerPort: 6379}]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-secrets, key: REDIS_PASSWORD}}
          readinessProbe:
            exec: {command: ["/bin/sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "octo-models.labels" . | nindent 4 }}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
