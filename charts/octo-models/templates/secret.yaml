apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "octo-models.labels" . | nindent 4 }}
stringData:
  LITELLM_MASTER_KEY: {{ .Values.secrets.llmMasterKey | quote }}
  DATABASE_URL: {{ include "octo-models.dburl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- if .Values.app.enabled }}
  SESSION_SECRET: {{ required "secrets.sessionSecret required when app.enabled" .Values.secrets.sessionSecret | quote }}
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  GITHUB_ORG: {{ .Values.secrets.githubOrg | quote }}
  {{- end }}
  {{- if .Values.secrets.slackWebhook }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhook | quote }}
  {{- end }}
  {{- if .Values.secrets.hotaisleApiToken }}
  HOTAISLE_API_TOKEN: {{ .Values.secrets.hotaisleApiToken | quote }}
  {{- end }}
  {{- if .Values.secrets.promBcrypt }}
  PROM_USER: {{ .Values.secrets.promUser | quote }}
  PROM_PASSWORD: {{ .Values.secrets.promPassword | quote }}
  PROM_WEB_CONFIG: |
    basic_auth_users:
      {{ .Values.secrets.promUser }}: {{ .Values.secrets.promBcrypt | quote }}
  {{- end }}
