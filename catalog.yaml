    host: openshift
    name: "Qwen 3.8 Flash Next NVFP4 (Best of Both)"
    served_model: Inferact/Qwen3.8-Flash-Next-NVFP4
    tier: balanced
    group: qwen38-flash-next
    price: {input: 0.20, output: 1.00}  # notional $/Mtok vs public APIs
    base_url: https://qwen38-flash-next-d57178e0-2037-479e-9a33-217f81dd6f5e.apps.emerg.pcbk.p1.openshiftapps.com/v1
    api_key: sk-local
    context: 262144
    max_output: 8192
    tool_call: true
    reasoning: true
    quant: nvfp4
    status: running

  - id: rtx5090-fast
    host: rtx5090
    name: "Qwen 3.8 27B NVFP4 (Fast)"
