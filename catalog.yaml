# Single source of truth for the OCTO Open Models platform.
# Every deploy file, user config, and the web front end read from here.
# Regenerate user configs after editing: scripts/gen_configs.py

platform:
  name: OCTO Open Models
  dashboard_base: https://grafana-octo-models.apps.emerg.pcbk.p1.openshiftapps.com/d/open-models/octo-open-models-usage-and-activity
  app_url: https://octo-app-octo-models.apps.emerg.pcbk.p1.openshiftapps.com

defaults:
  health_path: /health
  models_path: /v1/models
  chat_path: /v1/chat/completions

# Central LiteLLM gateway (v2 platform). All user traffic goes through here;
# users never hit vLLM base_urls directly once the gateway is live.
# Regenerate gateway config after editing: scripts/gen_litellm_config.py
gateway:
  # route assigned after deploy, e.g. https://litellm-octo-models.apps.emerg.../v1
  base_url: https://litellm-octo-models.apps.emerg.pcbk.p1.openshiftapps.com/v1
  # licensing workaround: one shared litellm user owns every virtual key;
  # our app backend maps key -> github user in its own Postgres.
  shared_litellm_user: octo-shared
  # defaults applied when the backend mints a virtual key
  key_defaults:
    rpm: 600
    tpm: 250000
    max_parallel_requests: 8
    max_budget: 100       # notional USD/day - abuse guard only, never
    budget_duration: 1d   # surfaced in the UI; we show SAVINGS, not bills
  # notional $/Mtok are priced off frontier APIs; users see "saved vs frontier
  # API" = spend x this multiplier (Claude/GPT class, ~10x our notionals)
  frontier_savings_multiplier: 8
  # Tiers are NAMED BY ROLE, not speed (a frontier model may be slower than
  # core - that is fine; role = what you reach for it for):
  #   frontier = hardest agentic work (GLM on MI300X)
  #   core     = daily driver coding (27B on the 5090) - default
  #   bulk     = high-volume background/summarize (L40S cluster, cheap)
  #   lab      = sparks/strix: bake-offs + direct endpoints, no SLA, never a
  #              fallback target
  # litellm fallbacks on 5xx/timeout (acyclic; core box is the floor - it
  # never falls back, protecting it from pileups). Lab tier is deliberately
  # absent: slow, listed-only, not worth a tunnel into the serving path.
  fallbacks:
    qwen38-flash-next: [qwen38-27b-fast]
    glm-45-air: [qwen38-27b-fast]

hosts:
  hotaisle-1gpu:
    hardware: 1x AMD Instinct MI300X (192GB) - frontier tier, power off when idle ($3/hr)
    notes: replaces 2-GPU config 2026-09-06; 235B TP=2 demo = resize up for an afternoon
    compute:
      "off": ./scripts/hotaisle.sh off
      "on": HOTAISLE_SSH=hotaisle@23.183.40.87 HOTAISLE_MODEL=zai-org/GLM-4.5-Air-FP8 HOTAISLE_CTX=131072 ./scripts/hotaisle.sh serve && ./scripts/hotaisle.sh wait
  spark2:
    hardware: DGX Spark (GB10, 128GB unified)
    notes: Lab tier - direct endpoint only (VPN). Bake-off sandbox for new candidates.
  hotaisle:
    hardware: 2x AMD Instinct MI300X (192GB) - power off when idle
    compute:
      "off": ./scripts/hotaisle.sh off
      "on": ./scripts/hotaisle.sh serve && ./scripts/hotaisle.sh wait
    notes: enc1-gpuvm005; vLLM container auto-starts on boot; safe to power off (5090 carries the core group)
  rtx5090:
    hardware: RTX 5090 (32GB GDDR7)
    compute:
      "off": ssh 192.168.1.166 'podman stop qwen38-nvfp4'
      "on": ssh 192.168.1.166 'podman start qwen38-nvfp4 && sleep 45'
    notes: Core tier daily driver - NVFP4 quant, snappy, shorter context.
  openshift:
    hardware: OpenShift cluster, g6e GPU nodes (Ryan Cook's, spending plan covered)
    notes: Bulk tier - high-volume/low-cost on covered g6e cards, edge route.
  spark1:
    hardware: DGX Spark (GB10, 128GB unified)
    notes: Future slot.
  spark3:
    hardware: DGX Spark (GB10, 128GB unified)
    notes: Lab bake-off box - serving gpt-oss-120b (MXFP4, the canonical Spark model).
  spark4:
    hardware: DGX Spark (GB10, 128GB unified)
    notes: Was already serving Qwen3.8-27B-NVFP4+MTP spec-decode (port 8888);
      we rebound 0.0.0.0 on 2026-09-07. Lab-tier redundancy for the 5090.
  strix-halo:
    hardware: AMD Strix Halo (Ryzen AI Max, 128GB unified)
    notes: Grab it. Has qwen 3.8 on it already (verify). Future slot.

