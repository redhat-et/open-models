apiVersion: v1
kind: Template
metadata:
  name: monitoring-grafana
  namespace: enmaas-monitoring
message: "Grafana deployed - route https://${GRAFANA_ROUTE_HOST} (basic auth in front of grafana login)"
parameters:
  - name: GRAFANA_ROUTE_HOST
    required: true
  - name: GRAFANA_IMAGE
    value: "docker.io/grafana/grafana:12.4.11"
  - name: NGINX_IMAGE
    value: "docker.io/nginxinc/nginx-unprivileged:1.28-alpine"
  - name: STORAGE_CLASS
    value: "gp3-csi"
  - name: GRAFANA_STORAGE_GB
    value: "5"
  - name: GRAFANA_CPU
    value: "500m"
  - name: GRAFANA_MEM
    value: "1Gi"
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-datasources
      namespace: enmaas-monitoring
      labels:
        app.kubernetes.io/name: grafana
    data:
      datasources.yaml: |
        apiVersion: 1
        # Grafana stores datasources in its PVC-backed database. If a
        # "Prometheus" datasource already exists with a different (generated)
        # uid, provisioning a pinned uid makes Grafana try to update a record
        # it cannot find -- it logs "Datasource provisioning error: data
        # source not found" and then refuses to start at all. Deleting by name
        # first makes the pinned uid converge on any existing install.
        deleteDatasources:
          - name: Prometheus
            orgId: 1
        datasources:
          - name: Prometheus
            # The uid MUST stay "prometheus": the provisioned dashboards bind
            # their panels to datasource uid ${DS_PROMETHEUS}, whose dashboard
            # variable pins uid "prometheus". Omit this and Grafana generates a
            # random uid, every panel resolves to a datasource that does not
            # exist, and the dashboards render "No data" while the queries
            # themselves are perfectly healthy.
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: grafana-data
      namespace: enmaas-monitoring
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: ${STORAGE_CLASS}
      resources:
        requests:
          storage: ${GRAFANA_STORAGE_GB}Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: grafana
      namespace: enmaas-monitoring
      labels:
        app.kubernetes.io/name: grafana
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app.kubernetes.io/name: grafana
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana
        spec:
          serviceAccountName: grafana
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: grafana
              image: ${GRAFANA_IMAGE}
              env:
                - name: GF_SERVER_ROOT_URL
                  value: "https://${GRAFANA_ROUTE_HOST}"
                - name: GF_SERVER_HTTP_ADDR
                  value: "0.0.0.0"
                - name: GF_ANALYTICS_REPORTING_ENABLED
                  value: "false"
                - name: GF_ANALYTICS_CHECK_FOR_UPDATES
                  value: "false"
                # The nginx sidecar is the authentication boundary and strips
                # the Authorization header, so requests reach Grafana without
                # credentials. Anonymous Viewer lets dashboards render for
                # anyone nginx has already let in; the login form stays
                # enabled so an admin can still sign in for maintenance.
                - name: GF_AUTH_ANONYMOUS_ENABLED
                  value: "true"
                - name: GF_AUTH_ANONYMOUS_ORG_ROLE
                  value: "Viewer"
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: admin-user
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: admin-password
              ports:
                - name: http
                  containerPort: 3000
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: ${GRAFANA_CPU}
                  memory: ${GRAFANA_MEM}
              livenessProbe:
                httpGet: { path: /api/health, port: 3000 }
              readinessProbe:
                httpGet: { path: /api/health, port: 3000 }
              volumeMounts:
                - name: data
                  mountPath: /var/lib/grafana
                - name: datasources
                  mountPath: /etc/grafana/provisioning/datasources
                - name: dashboards
                  mountPath: /etc/grafana/provisioning/dashboards
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
            - name: nginx-auth
              image: ${NGINX_IMAGE}
              ports:
                - name: proxy
                  containerPort: 8443
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              livenessProbe:
                tcpSocket: { port: 8443 }
              volumeMounts:
                - name: nginx-config
                  mountPath: /etc/nginx/conf.d/default.conf
                  subPath: default.conf
                  readOnly: true
                - name: basicauth
                  mountPath: /etc/nginx/secrets
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: grafana-data
            - name: datasources
              configMap:
                name: grafana-datasources
            - name: dashboards
              projected:
                sources:
                  - configMap:
                      name: grafana-dashboards
                  - configMap:
                      name: grafana-rds-dashboard
                  - configMap:
                      name: grafana-performance-dashboard
                  - configMap:
                      name: grafana-sre-dashboard
            - name: nginx-config
              configMap:
                name: grafana-nginx-auth
            - name: basicauth
              secret:
                secretName: monitoring-basic

  - apiVersion: v1
    kind: Service
    metadata:
      name: grafana
      namespace: enmaas-monitoring
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: grafana-proxy-tls
      labels:
        app.kubernetes.io/name: grafana
    spec:
      selector:
        app.kubernetes.io/name: grafana
      ports:
        - name: proxy
          port: 8443
          targetPort: proxy
        - name: http
          port: 3000
          targetPort: http
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: grafana
      namespace: enmaas-monitoring
    spec:
      host: ${GRAFANA_ROUTE_HOST}
      to:
        kind: Service
        name: grafana
        weight: 100
      port:
        targetPort: proxy
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  - apiVersion: oauth.openshift.io/v1
    kind: OAuthClient
    metadata:
      name: grafana
      namespace: enmaas-monitoring
    redirectURIs:
      - "https://${GRAFANA_ROUTE_HOST}/oauth2/callback"
    grantMethod: auto
    redirectReferenceMethod: exact
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-nginx-auth
      namespace: enmaas-monitoring
    data:
      default.conf: |
        server {
          listen 8443;
          location / {
            auth_basic "enmaas";
            auth_basic_user_file /etc/nginx/secrets/htpasswd;
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $remote_user;
            # Clear the browser's basic-auth header before it reaches Grafana.
            # nginx is the authentication boundary; if the header survives,
            # Grafana tries to authenticate those credentials as a Grafana
            # user, fails on every single request, and eventually answers
            # "too many consecutive incorrect login attempts ... temporarily
            # blocked" while filling its log at several lines per second.
            proxy_set_header Authorization "";
          }
        }
