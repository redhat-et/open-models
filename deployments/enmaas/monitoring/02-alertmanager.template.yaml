apiVersion: v1
kind: Template
metadata:
  name: monitoring-alertmanager
  namespace: enmaas-monitoring
message: "Alertmanager deployed - route https://${AM_ROUTE_HOST} (basic auth)"
parameters:
  - name: AM_ROUTE_HOST
    required: true
  # Points at the GitHub-SSO front door (alertmanager-oauth route), not the
  # basic-auth route, so clicking an alert does not re-prompt for a password.
  - name: AM_EXTERNAL_HOST
    required: true
  - name: AM_IMAGE
    value: "quay.io/prometheus/alertmanager:v0.28.1"
  - name: NGINX_IMAGE
    value: "docker.io/nginxinc/nginx-unprivileged:1.28-alpine"
  - name: AM_CPU
    value: "200m"
  - name: AM_MEM
    value: "512Mi"
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: alertmanager-config
      namespace: enmaas-monitoring
      labels:
        app.kubernetes.io/name: alertmanager
    data:
      alertmanager.yml: |
        route:
          receiver: slack
          group_by: ["alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - matchers:
                - severity =~ "page|critical"
              receiver: slack
              continue: false
        receivers:
          - name: default
          - name: slack
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/slack-url
                channel: "#enmaas-alerts"
                send_resolved: true
                title: '{{ template "slack.default.title" . }}'
                text: '{{ template "slack.default.text" . }}'
        inhibit_rules:
          - source_matchers:
              - severity = page
            target_matchers:
              - severity =~ "critical|warning"
            equal: ["alertname"]
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: alertmanager
      namespace: enmaas-monitoring
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app.kubernetes.io/name: alertmanager
      template:
        metadata:
          labels:
            app.kubernetes.io/name: alertmanager
        spec:
          serviceAccountName: alertmanager
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: alertmanager
              image: ${AM_IMAGE}
              args:
                - --config.file=/etc/alertmanager/alertmanager.yml
                - --storage.path=/alertmanager
                - --web.listen-address=0.0.0.0:9093
                # Without this, generated links (Slack {{ .ExternalURL }}, the
                # web UI) fall back to the pod hostname. Pin the public SSO route.
                - --web.external-url=https://${AM_EXTERNAL_HOST}
              ports:
                - name: http
                  containerPort: 9093
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: ${AM_CPU}
                  memory: ${AM_MEM}
              livenessProbe:
                httpGet: { path: /-/healthy, port: 9093 }
              readinessProbe:
                httpGet: { path: /-/ready, port: 9093 }
              volumeMounts:
                - name: config
                  mountPath: /etc/alertmanager
                - name: data
                  mountPath: /alertmanager
                - name: slack
                  mountPath: /etc/alertmanager/secrets
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
            - name: nginx-auth
              image: ${NGINX_IMAGE}
              ports:
                - name: proxy
                  containerPort: 8443
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              livenessProbe:
                tcpSocket: { port: 8443 }
              volumeMounts:
                - name: nginx-config
                  mountPath: /etc/nginx/conf.d/default.conf
                  subPath: default.conf
                  readOnly: true
                - name: basicauth
                  mountPath: /etc/nginx/secrets
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
          volumes:
            - name: config
              configMap:
                name: alertmanager-config
            - name: data
              emptyDir: {}
            - name: nginx-config
              configMap:
                name: alertmanager-nginx-auth
            - name: basicauth
              secret:
                secretName: monitoring-basic
            - name: slack
              secret:
                secretName: alertmanager-slack

  - apiVersion: v1
    kind: Service
    metadata:
      name: alertmanager
      namespace: enmaas-monitoring
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: alertmanager-proxy-tls
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      selector:
        app.kubernetes.io/name: alertmanager
      ports:
        - name: proxy
          port: 8443
          targetPort: proxy
        - name: http
          port: 9093
          targetPort: http
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: alertmanager
      namespace: enmaas-monitoring
    spec:
      host: ${AM_ROUTE_HOST}
      to:
        kind: Service
        name: alertmanager
        weight: 100
      port:
        targetPort: proxy
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  - apiVersion: oauth.openshift.io/v1
    kind: OAuthClient
    metadata:
      name: alertmanager
      namespace: enmaas-monitoring
    redirectURIs:
      - "https://${AM_ROUTE_HOST}/oauth2/callback"
    grantMethod: auto
    redirectReferenceMethod: exact
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: alertmanager-nginx-auth
      namespace: enmaas-monitoring
    data:
      default.conf: |
        server {
          listen 8443;
          location / {
            auth_basic "enmaas";
            auth_basic_user_file /etc/nginx/secrets/htpasswd;
            proxy_pass http://127.0.0.1:9093;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $remote_user;
          }
        }
