apiVersion: v1
kind: Template
metadata:
  name: monitoring-prometheus
  namespace: enmaas-monitoring
message: "Prometheus deployed - route https://${PROM_ROUTE_HOST} (basic auth)"
parameters:
  - name: PROM_ROUTE_HOST
    required: true
    description: "Full pinned route host (catalog pattern: never let the router guess)"
  - name: PROM_IMAGE
    value: "quay.io/prometheus/prometheus:v3.5.1"
  - name: NGINX_IMAGE
    value: "docker.io/nginxinc/nginx-unprivileged:1.28-alpine"
  - name: STORAGE_CLASS
    value: "gp3-csi"
  - name: PROM_STORAGE_GB
    value: "20"
  - name: RETENTION
    value: "30d"
  - name: PROM_CPU
    value: "500m"
  - name: PROM_MEM
    value: "1Gi"
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: prometheus-config
      namespace: enmaas-monitoring
      labels:
        app.kubernetes.io/name: prometheus
    data:
      prometheus.yml: |
        global:
          scrape_interval: 30s
          external_labels:
            env: enmaas-prod
            cluster: enmaas-prod
        alerting:
          alertmanagers:
            - static_configs:
                - targets: ["alertmanager:9093"]
        rule_files:
          - /etc/prometheus/rules-*.yml
          - /etc/prometheus/rules/*.yml
        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ["127.0.0.1:9090"]
          - job_name: alertmanager
            static_configs:
              - targets: ["alertmanager:9093"]
          - job_name: grafana
            static_configs:
              - targets: ["grafana:3000"]
          # Platform metrics (node/kubelet) federated from the in-cluster
          # openshift-monitoring Prometheus. RBAC: 08-platform-federation-rbac.yaml
          # (cluster-monitoring-view on our SA). honor_labels keeps origin labels.
          - job_name: platform-federation
            honor_labels: true
            metrics_path: /federate
            scheme: https
            authorization:
              type: Bearer
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              ca_file: /etc/prometheus/service-ca/service-ca.crt
            params:
              match[]:
                - '{__name__=~"node_.+"}'
                # Workload metrics are scoped to EnMaaS so federation does not
                # copy every container/pod in the cluster. These back the
                # Performance and Cluster Resources dashboards.
                - '{__name__=~"container_.+",namespace="enmaas"}'
                - '{__name__=~"kube_.+",namespace="enmaas"}'
                - '{__name__=~"kubelet_.+",namespace="enmaas"}'
                # Node inventory/capacity metrics have no namespace label.
                - '{__name__=~"kube_node_.+"}'
                - '{__name__=~"machine_.+"}'
                - '{__name__="up",job=~"node-exporter|kubelet|kube-state-metrics"}'
            static_configs:
              - targets: ["prometheus-k8s.openshift-monitoring.svc:9091"]
          # EnMaaS workload metrics: any Service in these namespaces tagged
          # prometheus.io/scrape="true" is discovered automatically. Adding a
          # new component to monitoring = annotate its Service, no config change.
          - job_name: enmaas
            # role: endpoints, NOT role: service. Service discovery produces one
            # target per Service pointing at the Service VIP, so every scrape of
            # a multi-replica workload lands on a random pod. The counters then
            # oscillate between each pod's value (praxis was alternating
            # 297/231), Prometheus reads every decrease as a counter reset, and
            # rate()/increase() inflate wildly -- increase() over 1h reported
            # 10764 requests against a true total near 528. Every SLO here is
            # built on those counters, so the error ratio, availability, budget
            # and burn-rate alerts were all derived from noise.
            # Endpoints discovery yields one target per pod, which keeps each
            # counter monotonic. Service annotations are still readable, since
            # endpoints inherit them as __meta_kubernetes_service_annotation_*.
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names: [enmaas, cnpg-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                action: keep
                regex: "true"
              # Endpoints discovery yields one target per (pod, port). Every
              # scraped Service names its metrics port "metrics", so keep only
              # that one: without this praxis (metrics/openai/unified) would
              # produce three targets per pod, all rewritten to the same
              # address, and Prometheus would ingest duplicate samples.
              # A Service annotated for scraping whose metrics port is NOT
              # named "metrics" will not be scraped -- that is the convention,
              # and the component-down alerts make a violation visible.
              - source_labels: [__meta_kubernetes_endpoint_port_name]
                action: keep
                regex: metrics
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
                action: replace
                target_label: __scheme__
                regex: "(https?)"
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: "(.+)"
              - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
                action: replace
                regex: "([^:]+)(?::\\d+)?;(\\d+)"
                replacement: "$1:$2"
                target_label: __address__
              - action: labelmap
                regex: __meta_kubernetes_service_label_(.+)
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_service_name]
                target_label: job
                replacement: "$1"
              # Per-pod identity, so a flapping or restarting replica is
              # attributable instead of hiding inside a Service-level average.
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              # The rds-postgres-exporter is a singleton proxying an external
              # RDS, so its per-pod instance (pod IP:port) churns on every
              # restart and leaves dashboards/alerts pinned to a dead target.
              # Overwrite instance with the stable Service name. Scoped by
              # service name so multi-replica services keep their per-pod
              # instance (and monotonic counters) unchanged.
              - source_labels: [__meta_kubernetes_service_name]
                regex: rds-postgres-exporter
                target_label: instance
                replacement: rds-postgres-exporter
      rules-alerts.yml: |
        groups:
          - name: enmaas-slos
            # SLI / SLO for the praxis gateway (the user-facing model proxy).
            # SLO: 99.9% availability over 30d (errors = 5xx responses),
            #      p99 request duration < 4s.
            rules:
              - record: slo:praxis:request_rate:5m
                expr: sum(rate(praxis_upstream_requests_total[5m]))
              - record: slo:praxis:error_rate:5m
                expr: sum(rate(praxis_http_requests_total{status_class="5xx"}[5m]))
              - record: slo:praxis:error_ratio:5m
                expr: |
                  sum(rate(praxis_http_requests_total{status_class="5xx"}[5m]))
                    / clamp_min(sum(rate(praxis_upstream_requests_total[5m])), 1e-3)
              - record: slo:praxis:availability:30d
                expr: |
                  1 - sum(rate(praxis_http_requests_total{status_class="5xx"}[30d]))
                    / clamp_min(sum(rate(praxis_upstream_requests_total[30d])), 1e-3)
              - record: slo:praxis:error_budget_remaining:30d
                expr: (slo:praxis:availability:30d - 0.999) / (1 - 0.999)
          - name: enmaas-slo-alerts
            rules:
              # Multi-window multi-burn: 14.4x burn for 1h consumes ~2% of the
              # 30d error budget; 3x for 6h consumes ~2.5%. (SRE workbook)
              - alert: PraxisErrorBudgetBurnCritical
                expr: slo:praxis:error_ratio:5m > 0.001 * 14.4
                for: 1h
                labels:
                  severity: page
                annotations:
                  summary: "Praxis error budget burning fast ({{ $value | humanizePercentage }} error rate)"
                  description: "Error ratio sustained above 14.4x burn rate for 1h; ~2% of the 30d budget consumed."
              - alert: PraxisErrorBudgetBurnWarning
                expr: slo:praxis:error_ratio:5m > 0.001 * 3
                for: 6h
                labels:
                  severity: warning
                annotations:
                  summary: "Praxis error budget burning ({{ $value | humanizePercentage }} error rate)"
                  description: "Error ratio above 3x burn rate for 6h."
              - alert: PraxisP99Latency
                expr: praxis_http_request_duration_seconds{quantile="0.99"} > 4
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Praxis p99 latency over SLO ({{ $value }}s > 4s)"
                  description: "p99 request duration above the 4s SLO target for 10m."
          - name: monitoring-self
            rules:
              - alert: MonitoringComponentDown
                expr: up{job=~"prometheus|alertmanager|grafana|praxis|maas-api|cnpg-controller-metrics|aigateway-pg-metrics|rds-postgres-exporter"} == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "{{ $labels.job }} scrape target is down"
                  description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }}) for 5m."
              - alert: PrometheusConfigReloadFailed
                expr: prometheus_config_last_reload_successful == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Prometheus config reload failing"
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: prometheus-data
      namespace: enmaas-monitoring
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: ${STORAGE_CLASS}
      resources:
        requests:
          storage: ${PROM_STORAGE_GB}Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: prometheus
      namespace: enmaas-monitoring
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app.kubernetes.io/name: prometheus
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prometheus
        spec:
          serviceAccountName: prometheus
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prometheus
              image: ${PROM_IMAGE}
              args:
                - --config.file=/etc/prometheus/prometheus.yml
                - --storage.tsdb.path=/prometheus
                - --storage.tsdb.retention.time=${RETENTION}
                - --web.listen-address=0.0.0.0:9090
              ports:
                - name: metrics
                  containerPort: 9090
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: ${PROM_CPU}
                  memory: ${PROM_MEM}
              livenessProbe:
                httpGet: { path: /-/healthy, port: 9090 }
              readinessProbe:
                httpGet: { path: /-/ready, port: 9090 }
              volumeMounts:
                - name: config
                  mountPath: /etc/prometheus
                - name: service-ca
                  mountPath: /etc/prometheus/service-ca
                  readOnly: true
                - name: data
                  mountPath: /prometheus
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
            - name: nginx-auth
              image: ${NGINX_IMAGE}
              ports:
                - name: proxy
                  containerPort: 8443
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              livenessProbe:
                tcpSocket: { port: 8443 }
              volumeMounts:
                - name: nginx-config
                  mountPath: /etc/nginx/conf.d/default.conf
                  subPath: default.conf
                  readOnly: true
                - name: basicauth
                  mountPath: /etc/nginx/secrets
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
          volumes:
            - name: config
              configMap:
                name: prometheus-config
            - name: service-ca
              configMap:
                name: openshift-service-ca.crt
            - name: data
              persistentVolumeClaim:
                claimName: prometheus-data
            - name: nginx-config
              configMap:
                name: prometheus-nginx-auth
            - name: basicauth
              secret:
                secretName: monitoring-basic

  - apiVersion: v1
    kind: Service
    metadata:
      name: prometheus
      namespace: enmaas-monitoring
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: prometheus-proxy-tls
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      selector:
        app.kubernetes.io/name: prometheus
      ports:
        - name: proxy
          port: 8443
          targetPort: proxy
        - name: metrics
          port: 9090
          targetPort: metrics
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: prometheus
      namespace: enmaas-monitoring
    spec:
      host: ${PROM_ROUTE_HOST}
      to:
        kind: Service
        name: prometheus
        weight: 100
      port:
        targetPort: proxy
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  - apiVersion: oauth.openshift.io/v1
    kind: OAuthClient
    metadata:
      name: prometheus
      namespace: enmaas-monitoring
    redirectURIs:
      - "https://${PROM_ROUTE_HOST}/oauth2/callback"
    grantMethod: auto
    redirectReferenceMethod: exact
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: prometheus-nginx-auth
      namespace: enmaas-monitoring
    data:
      default.conf: |
        server {
          listen 8443;
          location / {
            auth_basic "enmaas";
            auth_basic_user_file /etc/nginx/secrets/htpasswd;
            proxy_pass http://127.0.0.1:9090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-User $remote_user;
          }
        }
