apiVersion: v1
kind: Namespace
metadata:
  name: enmaas-monitoring
  labels:
    app.kubernetes.io/part-of: enmaas
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: enmaas-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: enmaas-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: enmaas-monitoring
---
# App ports are only reachable from inside this namespace (scraping);
# everything external must go through the oauth-proxy port 8443.
# Same-pod sidecar traffic bypasses policies, so apps may bind 0.0.0.0.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-except-proxy
  namespace: enmaas-monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 9090
          protocol: TCP
        - port: 9093
          protocol: TCP
        - port: 3000
          protocol: TCP
    - ports:
        - port: 8443
          protocol: TCP
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-mem-defaults
  namespace: enmaas-monitoring
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
