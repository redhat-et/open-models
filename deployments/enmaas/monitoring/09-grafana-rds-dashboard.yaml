apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rds-dashboard
  namespace: enmaas-monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  enmaas-rds-postgres.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "RDS reachable",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max(pg_up{job=\"rds-postgres-exporter\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Exporter scrape error",
          "description": "1 means at least one collector failed. Check collector health below and exporter logs.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0},
          "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "green", "text": "OK"}, "1": {"color": "red", "text": "ERROR"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max(pg_exporter_last_scrape_error{job=\"rds-postgres-exporter\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Connections",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0},
          "fieldConfig": {"defaults": {"unit": "conns"}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum(pg_stat_database_numbackends{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 4,
          "type": "gauge",
          "title": "Connection utilization",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 85}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "100 * sum(pg_stat_database_numbackends{job=\"rds-postgres-exporter\",datname=\"aigateway\"}) / max(pg_settings_max_connections{job=\"rds-postgres-exporter\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Longest transaction",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 60}, {"color": "red", "value": 300}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max(pg_stat_activity_max_tx_duration{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Cache hit ratio",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 95}, {"color": "green", "value": 99}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "100 * sum(rate(pg_stat_database_blks_hit{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m])) / clamp_min(sum(rate(pg_stat_database_blks_hit{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]) + rate(pg_stat_database_blks_read{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m])), 1)", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Transactions",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 5},
          "fieldConfig": {"defaults": {"unit": "tps", "custom": {"fillOpacity": 15}}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum(rate(pg_stat_database_xact_commit{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]))", "legendFormat": "commits/s", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}},
            {"refId": "B", "expr": "sum(rate(pg_stat_database_xact_rollback{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]))", "legendFormat": "rollbacks/s", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Locks by mode",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 5},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"fillOpacity": 10}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (mode) (pg_locks_count{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "legendFormat": "{{mode}}", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Temp spill and deadlocks",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 5},
          "fieldConfig": {"defaults": {"custom": {"fillOpacity": 10}}, "overrides": [{"matcher": {"id": "byName", "options": "temp bytes/s"}, "properties": [{"id": "unit", "value": "Bps"}]}]},
          "targets": [
            {"refId": "A", "expr": "sum(rate(pg_stat_database_temp_bytes{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]))", "legendFormat": "temp bytes/s", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}},
            {"refId": "B", "expr": "sum(increase(pg_stat_database_deadlocks{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[1h]))", "legendFormat": "deadlocks / hour", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Top tables by dead tuples",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 8, "x": 0, "y": 13},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"fillOpacity": 10}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "topk(10, pg_stat_user_tables_n_dead_tup{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "legendFormat": "{{relname}}", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Top tables by size",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 8, "x": 8, "y": 13},
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"fillOpacity": 10}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "topk(10, pg_stat_user_tables_size_bytes{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "legendFormat": "{{relname}}", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Collector health",
          "description": "0 identifies a collector unavailable to the least-privilege RDS monitoring role. WAL and database-size collectors are expected to be unavailable.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 8, "x": 16, "y": 13},
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "custom": {"fillOpacity": 10}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "min by (collector) (pg_scrape_collector_success{job=\"rds-postgres-exporter\"})", "legendFormat": "{{collector}}", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["enmaas", "rds", "postgresql"],
      "templating": {"list": [{"name": "DS_PROMETHEUS", "type": "datasource", "query": "prometheus", "current": {"name": "Prometheus", "type": "prometheus", "uid": "prometheus"}, "hide": 2, "label": "Prometheus", "options": [], "skipUrlSync": false}]},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "EnMaaS RDS PostgreSQL",
      "uid": "enmaas-rds-postgres",
      "version": 1
    }
