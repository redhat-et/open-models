apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rds-dashboard
  namespace: enmaas-monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  enmaas-rds-postgres.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "RDS reachable",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max(pg_up{job=\"rds-postgres-exporter\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Exporter scrape error",
          "description": "1 means at least one nbari collector failed. Check collector health below and exporter logs.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0},
          "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "green", "text": "OK"}, "1": {"color": "red", "text": "ERROR"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "1 - min(pg_exporter_collector_last_scrape_success{job=\"rds-postgres-exporter\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Connections",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0},
          "fieldConfig": {"defaults": {"unit": "conns"}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max(pg_stat_activity_used_connections{job=\"rds-postgres-exporter\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 4,
          "type": "gauge",
          "title": "Connection utilization",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 85}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "100 * max(pg_stat_activity_utilization_ratio{job=\"rds-postgres-exporter\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Oldest active query",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 60}, {"color": "red", "value": 300}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max(pg_stat_activity_oldest_query_age_seconds{job=\"rds-postgres-exporter\"})", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Cache hit ratio",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percent", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 95}, {"color": "green", "value": 99}]}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "100 * sum(rate(pg_stat_user_tables_heap_blks_hit_total{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]) + rate(pg_stat_user_tables_idx_blks_hit_total{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m])) / clamp_min(sum(rate(pg_stat_user_tables_heap_blks_hit_total{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]) + rate(pg_stat_user_tables_idx_blks_hit_total{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]) + rate(pg_stat_user_tables_heap_blks_read_total{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]) + rate(pg_stat_user_tables_idx_blks_read_total{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m])), 1)", "instant": true, "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Table row changes",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 5},
          "fieldConfig": {"defaults": {"unit": "ops", "custom": {"fillOpacity": 15}}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum(rate(pg_stat_user_tables_n_tup_ins{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]))", "legendFormat": "inserts/s", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}},
            {"refId": "B", "expr": "sum(rate(pg_stat_user_tables_n_tup_upd{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]))", "legendFormat": "updates/s", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}},
            {"refId": "C", "expr": "sum(rate(pg_stat_user_tables_n_tup_del{job=\"rds-postgres-exporter\",datname=\"aigateway\"}[5m]))", "legendFormat": "deletes/s", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Locks by mode",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 5},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"fillOpacity": 10}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (mode) (pg_locks_count{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "legendFormat": "{{mode}}", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Blocked, waiting and idle transactions",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 5},
          "fieldConfig": {"defaults": {"unit": "conns", "custom": {"fillOpacity": 10}}, "overrides": []},
          "targets": [
            {"refId": "A", "expr": "sum(pg_stat_activity_blocked_connections{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "legendFormat": "blocked", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}},
            {"refId": "B", "expr": "sum(pg_stat_activity_waiting_connections{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "legendFormat": "waiting", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}},
            {"refId": "C", "expr": "sum(pg_stat_activity_idle_in_transaction{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "legendFormat": "idle in transaction", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Top tables by dead tuples",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 8, "x": 0, "y": 13},
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"fillOpacity": 10}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "topk(10, pg_stat_user_tables_n_dead_tup{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "legendFormat": "{{relname}}", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Top tables by size",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 8, "x": 8, "y": 13},
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"fillOpacity": 10}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "topk(10, pg_stat_user_tables_table_size_bytes{job=\"rds-postgres-exporter\",datname=\"aigateway\"})", "legendFormat": "{{relname}}", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Collector health",
          "description": "1 means the nbari collector completed its latest scrape; 0 identifies a failed collector.",
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "gridPos": {"h": 9, "w": 8, "x": 16, "y": 13},
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "custom": {"fillOpacity": 10}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "min by (collector) (pg_exporter_collector_last_scrape_success{job=\"rds-postgres-exporter\"})", "legendFormat": "{{collector}}", "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"}}]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["enmaas", "rds", "postgresql"],
      "templating": {"list": [{"name": "DS_PROMETHEUS", "type": "datasource", "query": "prometheus", "current": {"name": "Prometheus", "type": "prometheus", "uid": "prometheus"}, "hide": 2, "label": "Prometheus", "options": [], "skipUrlSync": false}]},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "EnMaaS RDS PostgreSQL",
      "uid": "enmaas-rds-postgres",
      "version": 2
    }
