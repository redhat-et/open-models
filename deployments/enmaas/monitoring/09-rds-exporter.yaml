# RDS (PostgreSQL 16) metrics exporter for the metering database.
#
# The prod metering DB migrated from CNPG to AWS RDS (2026-09-30, see
# pricetag docs/operations/enmaas-rds-migration.md). CNPG's built-in
# pg_exporter (06-aigateway-pg-metrics.yaml) no longer covers prod, so a
# standalone prometheuscommunity/postgres-exporter targets the RDS endpoint.
#
# Design notes:
# - Runs in the `enmaas` namespace (not enmaas-monitoring) so the
#   annotation-driven `enmaas` scrape job discovers it automatically - no
#   scrape_config change needed. The Service's name becomes the `job` label.
# - Uses the EXISTING read-only RDS URL secret (metering_reader, least
#   privilege). No new credentials; secrets never live in templates.
# - DATA_SOURCE_NAME supports sslmode=require; RDS enforces TLS server-side
#   (rds.force_ssl). Scrape via the in-cluster Service -> postgres_exporter
#   holds the single TLS connection to RDS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-postgres-exporter
  namespace: enmaas
  labels:
    app.kubernetes.io/part-of: enmaas
    app.kubernetes.io/name: rds-postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rds-postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rds-postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: metering-readonly-db-url
                  key: READ_DATABASE_URL
            # pg_stat_database etc. need the connection but no superuser.
            - name: PG_EXPORTER_DISABLE_DEFAULT_METRICS
              value: "false"
          ports:
            - name: metrics
              containerPort: 9187
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rds-postgres-exporter
  namespace: enmaas
  labels:
    app.kubernetes.io/part-of: enmaas
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
  selector:
    app.kubernetes.io/name: rds-postgres-exporter
