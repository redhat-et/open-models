# Least-privilege RBAC for annotation-driven service discovery of EnMaaS
# workload metrics in namespaces we don't own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-service-discovery
  namespace: enmaas
rules:
  # endpoints and pods are required by role: endpoints discovery, which
  # replaced role: service. Service discovery produced one target per Service
  # VIP, so multi-replica workloads were scraped round-robin and their
  # counters oscillated between pods -- see the prometheus job comment.
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-service-discovery
  namespace: enmaas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-service-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: enmaas-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-service-discovery
  namespace: cnpg-system
rules:
  # endpoints and pods are required by role: endpoints discovery, which
  # replaced role: service. Service discovery produced one target per Service
  # VIP, so multi-replica workloads were scraped round-robin and their
  # counters oscillated between pods -- see the prometheus job comment.
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-service-discovery
  namespace: cnpg-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-service-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: enmaas-monitoring
