apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-27b
  namespace: llm-serving
  labels:
    app: qwen38-27b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen38-27b
  template:
    metadata:
      labels:
        app: qwen38-27b
    spec:
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.25.0
          args:
            - "--model"
            - "Qwen/Qwen3.8-27B"
            - "--tensor-parallel-size"
            - "4"
            - "--max-model-len"
            - "262144"
            - "--enable-prefix-caching"
            - "--reasoning-parser"
            - "qwen3"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "qwen3_coder"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: "4"
            requests:
              nvidia.com/gpu: "4"
              cpu: "8"
              memory: "64Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 240
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 240
            periodSeconds: 10
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      nodeSelector:
        gpu-pool-size: gpu-pool-large
---
apiVersion: v1
kind: Service
metadata:
  name: qwen38-27b
  namespace: llm-serving
  labels:
    app: qwen38-27b
spec:
  selector:
    app: qwen38-27b
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: qwen38-27b
  namespace: llm-serving
  labels:
    app: qwen38-27b
spec:
  to:
    kind: Service
    name: qwen38-27b
  port:
    targetPort: http
  tls:
    termination: edge
